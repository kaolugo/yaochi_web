<!DOCTYPE html>
<html lang = "ja">
    <head>
        <meta charset="utf-8">
        <meta name = "viewport" content = "width=device-width, initial-scale = 1">
        <link rel="stylesheet" type="text/css" href="menuStyle.css">

        <link rel="stylesheet" href="flickity/flickity.min.css" media="screen">

        <link rel="icon" type="image/x-icon" href="icon.ico"/>
        <title>矢落・メニュー</title>

        <script>
            const sheetUrl = "https://script.google.com/macros/s/AKfycby_rTl5ElIUcf0Fxd_-_chgbUcB2vEPFgADKTQMv7_I-7eoRVnOzbK786BGArXJMDpo/exec";
            window.menuDataPromise = fetch(sheetUrl).then(r => r.json());
        </script>
    </head>

    <body>
        
        <div class = "okonomiyakiBannerContainer">
            <img src = "img/assets_2026/menu_okonomiyaki.png" alt = "Okonomiyaki Banner" class = "okonomiyakiBanner">
        </div>

        <div class = "menuContainer">
            <div class = "menuHeading">
                <div class = "wrap">
                    <img class = "okonomiSVG" src="img/assets_2026/okonomiyaki_menu.svg" alt="">
                </div>
                <div class = "menuHeadingText">メニュー</div>
                <div class = "wrap">
                    <img class = "yakisobaSVG" src="img/assets_2026/yakisoba_menu.svg" alt="">
                </div>
            </div>
            <div class = "menuControl">
                <button class = "reset tategaki" data-target = "drinkSection">ドリンク</button>
                <button class = "reset tategaki" data-target = "lunchSection">ランチメニュー</button>
                <button class = "reset tategaki" data-target = "entreeSection">一品もの</button>
                <button class = "reset tategaki" data-target = "yakisobaSection">焼きそば</button>
                <button class = "reset tategaki" data-target = "okonomiyakiSection">お好み焼き</button>
                <button class = "reset tategaki" data-target = "recommendationSection">おすすめ</button>
                <button class = "reset tategaki active" data-target = "appetizerSection">とりあえず</button>
            </div>
        </div>

        <div class = "menuContent active" id = "appetizerSection">
            <div class = "menuTitle">とりあえず</div>
            <div class = "menuList" id="appetizer">
            </div>
        </div>

        <div class = "menuContent" id = "recommendationSection">
            <div class = "menuTitle">おすすめ</div>
            <div class = "menuList" id="recommendation">
            </div>
        </div>

        <div class = "menuContent" id = "okonomiyakiSection">
            <div class = "menuTitle">お好み焼き</div>
            <div class = "menuList" id="okonomiyaki">
            </div>
        </div>

        <div class = "menuContent" id = "yakisobaSection">
            <div class = "menuTitle">焼きそば</div>
            <div class = "menuList" id="yakisoba">
            </div>
        </div>

        <div class = "menuContent" id = "entreeSection">
            <div class = "menuTitle">一品もの</div>
            <div class = "menuList" id = "entree">
            </div>
        </div>

        <div class = "menuContent" id = "lunchSection">
            <div class = "menuTitle">ランチメニュー</div>
            <div class = "menuList" id = "lunch">
            </div>
        </div>

        <div class = "menuContent" id = "drinkSection">
            <div class = "menuTitle">ドリンク</div>
            <div class = "menuList" id = "drink">
            </div>
        </div>

        <div class ="contact">
            <img src="img/assets_2026/yaochi_square.svg" />
            <div>
                <div class = "contactHeader">営業時間</div>
                <div class = "contactBody">Lunch 平日　　 11:00-15:00</div>
                <div class = "contactBody">Dinner 平日　　16:30-22:00 (L.O.21:00)</div>
                <div class = "contactBody">祝日・平日　　11:00-22:00 (L.O.21:00)</div>
            </div>

            <div>
                <div class = "contactHeader">店舗所在地</div>
                <div class = "contactBody">兵庫県宝塚市栄町２-１-１</div>
                <div class = "contactBody">阪急宝塚駅前　ソリオ宝塚　GF</div>
            </div>

            <div>
                <div class = "contactHeader">ご予約・お問い合わせはこちら</div>
                <div class = "contactBody">TEL: 0797-86-1068</div>
            </div>
        </div>


        <footer>
           <div>© 2026 お好み焼き 矢落</div>
        </footer>
        
    </body>
    <script src="app.js" defer></script>

</html>
